[project]
name = "injurypredictor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lifelines>=0.30.3",
    "llvmlite>=0.49.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=2.3.3",
    "scikit-learn>=1.9.1",
    "scikit-survival>=0.28.0",
    "shap>=0.49.1",
    "xgboost>=3.4.1",
]

[project.scripts]
injurypredictor = "injurypredictor:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
